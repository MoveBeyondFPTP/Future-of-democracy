name: Probe data sources

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/probe.py
      - .github/workflows/probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/probe.py
      - name: Push results to the _probe branch
        run: |
          cd probe_out
          git init -q -b _probe
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add -A
          git commit -qm "probe results ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" _probe
